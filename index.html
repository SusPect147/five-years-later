.lead-head .lead-place{background:none;border:0;color:inherit;width:auto;height:auto}
.lead-row.top-1 .lead-place{background-color:var(--yel);color:var(--yel-ink);background-image:none;border-color:var(--ink)}
.lead-row.top-1{border-color:var(--acc)}
.lead-who{display:flex;flex-direction:column;line-height:1.2;white-space:normal}
.lw-name{font-weight:800;font-size:14px;letter-spacing:.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lw-sub{font-size:10.5px;color:var(--txt-4);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lead-score{font-weight:800;font-size:17px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.lead-row.mine{background:var(--acc-wash);border-color:var(--acc)}
.lead-row.mine .lw-name{color:var(--acc-hi)}

.leaders-empty{
  display:flex;align-items:flex-start;gap:var(--sp-4);
  margin-top:var(--sp-5);padding:var(--sp-6);
  border-radius:var(--r-l);
  background:var(--s-1);border:var(--bw) solid var(--card-line);
  box-shadow:var(--sh-card);
}
.leaders-empty .ic svg{width:22px;height:22px;color:var(--acc)}
.le-title{font-weight:800;font-size:15px;margin-bottom:4px}
.le-sub{font-size:13px;color:var(--txt-3);line-height:1.5}

.lead-result{
  margin-top:var(--sp-7);padding:var(--sp-5) var(--sp-6);
  border-radius:var(--r-l);
  background:var(--s-1);border:var(--bw) solid var(--card-line);
  box-shadow:var(--sh-card);
}
.lr-line{display:flex;align-items:center;gap:var(--sp-4);flex-wrap:wrap}
.lr-place{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:56px;height:44px;padding:0 10px;border-radius:var(--r-s);
  background:var(--yel);border:2px solid var(--ink);color:var(--yel-ink);
  font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;
}
.lr-text{flex:1 1 200px;min-width:0}
.lr-title{font-weight:800;font-size:15px}
.lr-sub{font-size:12.5px;color:var(--txt-3);margin-top:2px}
.lead-result .ln-line{margin-top:var(--sp-4)}

.lead-name{margin-top:var(--sp-7)}
.ln-line{display:flex;gap:var(--sp-3);margin-top:var(--sp-3);flex-wrap:wrap}
.ln-input{
  flex:1 1 220px;min-width:0;height:52px;
  padding:0 var(--sp-4);
  border-radius:var(--r-m);
  background:var(--s-1);
  border:var(--bw) solid var(--card-line);
  box-shadow:var(--sh-card-lo);
  color:var(--txt);font:inherit;font-size:15px;font-weight:700;
}
.ln-input:focus{outline:3px solid var(--acc);outline-offset:2px}
.ln-hint{margin-top:var(--sp-3);font-size:12px;color:var(--txt-4);line-height:1.5}

@media (max-width:720px){
  .lead-row{grid-template-columns:38px minmax(0,1fr) 62px 84px;gap:var(--sp-2);padding:10px var(--sp-3)}
  .lead-c.c4,.lead-c.c5{display:none}
}

/* ==================================================================
   СВОДКА ПРОГРЕССА — один компактный блок
   ================================================================== */

.progress-overview{
  margin-top:var(--sp-8);
  display:grid;
  grid-template-columns:1fr auto;
  grid-template-areas:"figs link" "bar bar";
  gap:var(--sp-4) var(--sp-5);
  align-items:center;
  padding:var(--sp-5) var(--sp-6);
  border-radius:var(--r-l);
  background:var(--s-1);
  border:var(--bw) solid var(--line);
}
.po-figs{grid-area:figs;display:flex;align-items:center;gap:var(--sp-6);flex-wrap:wrap}
.po-div{width:1px;height:26px;background:var(--line-2);flex:none}
.po-fig{display:flex;align-items:baseline;gap:8px}
.po-val{
  font-size:22px;font-weight:600;letter-spacing:-.03em;
  font-variant-numeric:tabular-nums;color:var(--txt);
}
.po-lab{font-size:10px}
.po-links{grid-area:link;display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;justify-content:flex-end}
.po-link{
  display:inline-flex;align-items:center;gap:6px;
  font-size:12.5px;color:var(--txt-3);
  padding:6px 10px;border-radius:var(--r-s);
  transition:color var(--t-micro) var(--ease),background var(--t-micro) var(--ease);
}
.po-link:hover{color:var(--acc);background:var(--acc-dim)}
.po-link:hover .ic{transform:translateX(2px)}
.po-link .ic{transition:transform var(--t-micro) var(--ease-out)}
.po-link .ic svg{width:13px;height:13px}

.progress-track{
  grid-area:bar;
  height:8px;border-radius:99px;
  background:var(--line);
  overflow:hidden;
}
.progress-track i{
  display:block;height:100%;border-radius:99px;
  background:var(--acc);
  animation:grow-x 900ms var(--ease-out) both;
  transform-origin:left;
}
@keyframes grow-x{from{transform:scaleX(0)}to{transform:none}}

/* ==================================================================
   ГЛАВНЫЙ CTA
   ================================================================== */

.menu-cta{
  position:sticky;bottom:var(--sp-5);
  z-index:40;
  margin-top:var(--sp-7);
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-5);
  padding:var(--sp-4) var(--sp-4) var(--sp-4) var(--sp-6);
  border-radius:var(--r-l);
  /* Тот же рецепт стекла, что и у верхней панели: сильное размытие,
     подкрученная насыщенность и лёгкий блик по кромке. Карточки под
     панелью должны просвечивать — иначе это просто плашка. */
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border:var(--bw) solid var(--line-2);
  box-shadow:var(--sh-4),inset 0 1px 0 var(--glass-edge);
  overflow:hidden;
}
/* Золотая нить по верхней кромке — та же метка, что у панели наверху */
.menu-cta::before{
  content:'';position:absolute;left:0;right:0;top:0;height:2px;
  background:var(--gold);opacity:.55;
}
.cta-info{min-width:0}
.cta-lab{margin-bottom:2px}
.cta-name{
  font-size:17px;font-weight:600;letter-spacing:-.02em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.cta-actions{display:flex;align-items:center;gap:var(--sp-3);flex:none}
.cta-main{min-width:200px}

/* ==================================================================
   ИГРОВОЙ ЭКРАН — ШАПКА ВРЕМЕНИ
   ================================================================== */

.game{min-height:100vh}

.hud{
  position:sticky;top:0;z-index:50;
  display:grid;
  grid-template-columns:auto minmax(0,1fr) auto auto;
  align-items:center;gap:var(--sp-6);
  padding:var(--sp-4) max(var(--sp-7), calc((100% - var(--wrap-game)) / 2 + var(--sp-7)));
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(180%);
  -webkit-backdrop-filter:blur(22px) saturate(180%);
  border-bottom:1px solid var(--line);
  box-shadow:inset 0 1px 0 var(--glass-edge);
}
.hud::after{
  content:'';position:absolute;left:0;right:0;bottom:-2px;height:2px;
  background:var(--gold);
}

.hud-when{display:flex;flex-direction:column;gap:1px;min-width:112px}
.hud-year{
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--acc);font-weight:650;
}
.hud-month{
  font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1.1;
  font-variant-numeric:tabular-nums;
  animation:month-in var(--t-base) var(--ease-out);
}
@keyframes month-in{from{opacity:0;transform:translateY(-5px)}to{opacity:1;transform:none}}
.hud-monthname{font-size:11.5px;color:var(--txt-4)}

.month-strip{
  display:flex;align-items:flex-end;justify-content:center;gap:2px;height:26px;
  min-width:0;overflow:hidden;
  padding:0 var(--sp-2);
}
.ms-tick{
  flex:1 1 0;min-width:1px;max-width:11px;
  height:7px;border-radius:1.5px;
  background:var(--line-2);
  transition:height var(--t-base) var(--ease-out),
             background var(--t-base) var(--ease),
             opacity var(--t-base) var(--ease);
}
.ms-tick.year{height:14px}
.ms-tick.past{background:var(--txt-4)}
.ms-tick.year.past{background:var(--txt-3)}
.ms-tick.future{background:var(--line);opacity:.6}
.ms-tick.now{height:24px;background:var(--gold)}

.hud-money{text-align:right;min-width:0}
.hud-lab{margin-bottom:2px}
.hud-cash{
  font-size:22px;font-weight:600;letter-spacing:-.025em;line-height:1.15;
  font-variant-numeric:tabular-nums;
  color:var(--txt);
}
.hud-cash.neg{color:var(--neg)}
.hud-sub{
  font-size:11px;color:var(--txt-4);margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:460px;
}

.hud-exit{
  width:36px;height:36px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-s);color:var(--txt-4);
  border:1px solid transparent;
  transition:color var(--t-micro) var(--ease),background var(--t-micro) var(--ease),border-color var(--t-micro) var(--ease);
}
.hud-exit:hover{color:var(--txt);background:var(--s-2);border-color:var(--line-2)}

/* Кнопки шапки партии: тема и выход стоят в одной ячейке сетки */
.hud-tools{display:flex;align-items:center;gap:6px}

/* Переключатель темы: иконка без подписи в любом размере окна */
.nav-btn.theme-btn{width:38px;padding:0;justify-content:center}
.theme-btn .ic{display:flex}
.theme-btn .ic svg{width:18px;height:18px}

/* ==================================================================
   ИГРОВОЙ ЭКРАН — ТЕЛО
   ================================================================== */

.game-body{
  /* flex:1 задаёт flex-basis:0 — высота считается от свободного места,
     а не от содержимого, и всё лишнее уходит за пределы документа
     без возможности прокрутки. Растём, но никогда не сжимаемся ниже контента. */
  flex:1 0 auto;
  width:100%;max-width:var(--wrap-game);margin:0 auto;
  padding:var(--sp-6) var(--sp-7) var(--sp-8);
  display:grid;
  grid-template-columns:minmax(0,1fr) 380px;
  gap:var(--sp-6);
  align-items:start;
}
.game-main{min-width:0;position:relative}
.stage-mount{position:relative;min-width:0}
@media (min-width:901px){.stage-mount{min-height:440px}}

.stage-idle{
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--sp-3);
  min-height:420px;padding:var(--sp-8);text-align:center;
  border-radius:var(--r-xl);
  border:1px dashed var(--line-2);
  background:var(--s-2);
  color:var(--txt-4);
}
.stage-idle.hidden{display:none}
.stage-idle .idle-ic{color:var(--acc);opacity:.5}
.idle-title{font-size:16px;color:var(--txt-2);font-weight:550}
.idle-text{font-size:13px;max-width:34ch;line-height:1.55}

/* Колонка не липкая. Липкий блок, который выше экрана, залипает верхом,
   и его низ становится недостижимым: страница едет, а он стоит на месте. */
.game-side{
  display:flex;flex-direction:column;gap:var(--sp-4);
  min-width:0;
}

.panel-label{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
  padding:var(--sp-4) var(--sp-5) var(--sp-3);
  border-bottom:1px solid var(--line);
}
.panel-sub{
  font-size:10.5px;letter-spacing:.05em;text-transform:none;
  color:var(--txt-4);font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:50%;
}

/* --- Панель состояния --- */

.status-panel{
  border-radius:var(--r-l);
  background:var(--s-1);
  border:var(--bw) solid var(--line);
  overflow:hidden;
}
.bars{display:flex;flex-direction:column}
.bar{
  position:relative;min-width:0;
  padding:var(--sp-3) var(--sp-5) var(--sp-4);
  border-bottom:1px solid var(--line);
}
.bar:last-child{border-bottom:0}
.bar-head{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:6px;min-width:0}
.bar-name{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--txt-2);
  min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-name .ic svg{width:14px;height:14px}
.bar-right{display:inline-flex;align-items:baseline;gap:7px}
.bar-value{
  font-size:15px;font-weight:640;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;
}
.bar-delta{
  font-size:11px;font-weight:600;font-variant-numeric:tabular-nums;
  min-width:26px;text-align:right;
  transition:color var(--t-base) var(--ease);
}
.bar-delta.up{color:var(--pos)}
.bar-delta.down{color:var(--neg)}
.bar-delta.flat{color:var(--txt-4)}

.bar-spark{height:26px;margin:2px 0 6px;opacity:.85;
  transition:height var(--t-base) var(--ease),margin var(--t-base) var(--ease)}
.bar-spark.empty{height:0;margin:0 0 4px}
.spark-svg{width:100%;height:100%;display:block}
.spark-line{fill:none;stroke:currentColor;stroke-width:1.6;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.spark-area{fill:currentColor;opacity:.10}
.spark-dot{fill:none;stroke:currentColor;stroke-width:4;stroke-linecap:round;vector-effect:non-scaling-stroke}

.bar-track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar-track i{
  display:block;height:100%;border-radius:99px;background:currentColor;
  transition:width 520ms var(--ease-out);
}
.bar-money{color:var(--c-money)}
.bar-calm{color:var(--c-calm)}
.bar-quality{color:var(--c-quality)}
.bar-energy{color:var(--c-energy)}
.bar .bar-name,.bar .bar-value{color:var(--txt)}
.bar .bar-name{color:var(--txt-2)}
.bar .bar-name .ic{color:currentColor}

.bar-track i.pulse{animation:bar-pulse 620ms var(--ease-out)}
@keyframes bar-pulse{
  0%{box-shadow:0 0 0 0 currentColor;filter:brightness(1.5)}
  100%{box-shadow:0 0 0 6px transparent;filter:none}
}

/* --- Хроника --- */

.chronicle{
  border-radius:var(--r-l);
  background:var(--s-1);
  border:var(--bw) solid var(--line);
  overflow:hidden;
  display:flex;flex-direction:column;
}
/* ВАЖНО: у ленты НЕТ своей прокрутки.
   Когда внутри страницы есть второй скроллер высотой в несколько экранов,
   колесо мыши над ним прокручивает его, а страница не двигается вообще —
   со стороны это выглядит как «скролл не работает». На странице должна быть
   ровно одна ось прокрутки: сама страница. Длину ленты ограничиваем не
   высотой блока, а числом показанных месяцев. */
.timeline{
  overflow:visible;
  padding:var(--sp-3) var(--sp-4) var(--sp-5);
}
.timeline.rushing{filter:blur(.3px);opacity:.85;transition:opacity 200ms,filter 200ms}

/* Свёрнутая хроника: далёкие месяцы остаются в разметке, но не растягивают
   страницу. Разворачивается кнопкой — на любом размере экрана. */
.timeline:not(.full) .tl-month.far-past,
.timeline:not(.full) .tl-month.far-future{display:none}
.tl-more{
  display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
  margin-top:var(--sp-3);padding:10px;
  border-radius:var(--r-s);
  background:var(--s-2);border:var(--bw) solid var(--line-2);
  color:var(--txt-3);font-size:12px;font-weight:550;
  transition:background var(--t-micro) var(--ease),color var(--t-micro) var(--ease);
}
.tl-more .ic svg{width:13px;height:13px}
.tl-more:hover{background:var(--s-3);color:var(--txt-2)}

.tl-month{
  display:grid;grid-template-columns:18px minmax(0,1fr);
  gap:var(--sp-3);
  padding:4px 0;
}
.tl-spine{display:flex;flex-direction:column;align-items:center;padding-top:6px}
.tl-node{
  width:9px;height:9px;border-radius:50%;
  background:var(--line-3);flex:none;
  transition:background var(--t-base) var(--ease),box-shadow var(--t-base) var(--ease);
}
.tl-spine::after{
  content:'';flex:1;width:2px;margin-top:4px;border-radius:2px;
  background:var(--line);
}
.tl-month.past{opacity:.62}
.tl-month.past:hover{opacity:1}
.tl-month.now .tl-node{
  background:var(--gold);
  box-shadow:0 0 0 4px var(--warn-soft);
}
.tl-month.future{opacity:.24;min-height:0}
.tl-month.future .tl-body{padding:0}
.tl-month.future .tl-name-row{margin:0}
.tl-month.year-start{margin-top:var(--sp-3)}

.tl-body{min-width:0;padding-bottom:2px}
.tl-year{
  font-size:9.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--acc);opacity:.7;font-weight:650;margin-bottom:2px;
}
.tl-name-row{display:flex;align-items:center;gap:var(--sp-2);margin-bottom:4px}
.tl-name{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-3);font-weight:600}
.tl-badge{
  font-size:9px;letter-spacing:.12em;text-transform:uppercase;
  padding:2px 6px;border-radius:99px;
  background:var(--acc-dim-2);color:var(--acc-hi);font-weight:650;
}
.tl-figures{display:flex;gap:var(--sp-2);margin-bottom:5px}
.fig{
  font-size:11.5px;font-weight:600;font-variant-numeric:tabular-nums;
  padding:2px 7px;border-radius:var(--r-xs);
  background:var(--s-3);color:var(--txt-2);
}
.fig.neg{color:var(--neg);background:var(--neg-soft)}

.tl-rec{
  display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);
  padding:6px 9px;margin-bottom:3px;
  border-radius:var(--r-xs);
  background:var(--s-2);
  border-left:4px solid var(--line-3);
  font-size:11.5px;line-height:1.4;color:var(--txt-2);
  animation:rec-in 320ms var(--ease-out) both;
}
@keyframes rec-in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.tl-rec .rec-text{min-width:0}
.tl-rec .rec-amt{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap;color:var(--txt-3)}
.tl-rec.good{border-left-color:var(--pos)}
.tl-rec.good .rec-amt{color:var(--pos)}
.tl-rec.bad{border-left-color:var(--neg)}
.tl-rec.bad .rec-amt{color:var(--neg)}
.tl-rec.debt{border-left-color:var(--warn)}
.tl-rec.reserve{border-left-color:var(--c-calm)}
.tl-rec.info{border-left-color:var(--line-3)}

.tl-month-sum{
  margin-top:4px;
  border-radius:var(--r-xs);
  background:var(--s-2);
  border:var(--bw) solid var(--line);
  overflow:hidden;
}
.tl-sum-head{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
  padding:6px 9px;cursor:pointer;list-style:none;
  transition:background var(--t-micro) var(--ease);
}
.tl-sum-head::-webkit-details-marker{display:none}
.tl-sum-head:hover{background:var(--s-3)}
.tl-sum-lab{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--txt-4)}
.tl-sum-val{font-size:12px;font-weight:650;font-variant-numeric:tabular-nums}
.tl-month-sum.up .tl-sum-val{color:var(--pos)}
.tl-month-sum.down .tl-sum-val{color:var(--neg)}
.tl-sum-row{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
  padding:4px 9px;font-size:11px;color:var(--txt-3);
  border-top:1px solid var(--line);
}
.tl-sum-num{font-variant-numeric:tabular-nums}
.tl-sum-row.in .tl-sum-num{color:var(--pos)}
.tl-sum-row.out .tl-sum-num{color:var(--txt-2)}
.tl-sum-row.total{background:var(--s-3);color:var(--txt-2);font-weight:600}

/* ==================================================================
   КАРТА РЕШЕНИЯ — центральный компонент
   ================================================================== */

.sheet-wrap{
  position:relative;
  animation:sheet-rise var(--t-screen) var(--ease-out) both;
}
@keyframes sheet-rise{
  from{opacity:0;transform:translateY(18px) scale(.985)}
  to{opacity:1;transform:none}
}
.sheet-wrap.commit{
  animation:sheet-commit 380ms var(--ease) forwards;
}
@keyframes sheet-commit{
  to{opacity:0;transform:translateY(-14px) scale(.975);filter:blur(2px)}
}

.sheet{
  position:relative;
  border-radius:var(--r-xl);
  background:var(--s-1);
  border:var(--bw) solid var(--card-line);
  box-shadow:var(--sh-card-hi);
  padding:var(--sp-6) var(--sp-7) var(--sp-6);
  overflow:hidden;
}
/* Верхняя полоса — «корешок» карточки: сразу видно, где начинается ход */
.sheet::before{
  content:'';position:absolute;left:0;right:0;top:0;height:6px;
  background:var(--acc);
}

.sheet-head{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;position:relative}
.kind{
  display:inline-flex;align-items:center;gap:6px;
  padding:4px 10px;border-radius:99px;
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;
  background:var(--s-3);border:var(--bw) solid var(--line-2);color:var(--txt-3);
  box-shadow:var(--sh-card-lo);
}
.kind-dot{width:5px;height:5px;border-radius:50%;background:currentColor}
.kind-temptation{color:var(--warn);border-color:var(--warn-line);background:var(--warn-soft)}
.kind-shock{color:var(--neg);border-color:var(--neg-line);background:var(--neg-soft)}
.kind-scam{color:var(--neg);border-color:var(--neg-line);background:var(--neg-soft)}
.kind-offer{color:var(--info);border-color:var(--info-line);background:var(--info-soft)}
.kind-opportunity{color:var(--pos);border-color:var(--pos-line);background:var(--pos-soft)}
.kind-social{color:var(--c-quality);border-color:var(--viol-line);background:var(--viol-soft)}
.kind-quiet{color:var(--txt-3)}
.kind-inter{background:transparent;border-style:dashed}
.sheet-month{
  margin-left:auto;
  display:inline-flex;align-items:center;gap:6px;
  font-size:11.5px;color:var(--txt-4);
}
.sheet-month .ic svg{width:13px;height:13px}

.sheet-title{
  margin:var(--sp-4) 0 0;
  font-size:clamp(24px,2.4vw,32px);
  line-height:1.15;font-weight:600;letter-spacing:-.03em;
  position:relative;
}
.sheet-text{
  margin:var(--sp-3) 0 0;max-width:62ch;
  font-size:14.5px;line-height:1.65;color:var(--txt-2);
  position:relative;
}

.sheet-ctx{
  display:flex;flex-wrap:wrap;gap:1px;
  margin-top:var(--sp-5);
  border:var(--bw) solid var(--line);border-radius:var(--r-s);
  background:var(--line);overflow:hidden;position:relative;
}
.sctx{
  flex:1 1 130px;
  display:flex;flex-direction:column;gap:2px;
  padding:9px 12px;background:var(--s-2);
}
.sctx-val{font-size:14px;font-weight:640;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sctx.neg .sctx-val{color:var(--neg)}

.sheet-body{margin-top:var(--sp-5);position:relative}

.event-step{
  display:flex;align-items:center;gap:7px;
  margin-bottom:var(--sp-3);
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;font-weight:650;
  color:var(--txt-4);
}
.event-step .ic svg{width:13px;height:13px;color:var(--acc);opacity:.75}

/* --- Варианты решения --- */

.choices{display:flex;flex-direction:column;gap:var(--sp-3)}

.choice{
  position:relative;
  display:block;width:100%;text-align:left;
  padding:var(--sp-4) var(--sp-6) var(--sp-4) var(--sp-5);
  border-radius:var(--r-m);
  background:var(--s-2);
  border:var(--bw) solid var(--card-line);
  box-shadow:var(--sh-card);
  transition:background var(--t-base) var(--ease),
             border-color var(--t-base) var(--ease),
             transform var(--t-micro) var(--ease-out),
             box-shadow var(--t-base) var(--ease);
  animation:choice-in 340ms var(--ease-out) both;
}
.choice:nth-child(1){animation-delay:40ms}
.choice:nth-child(2){animation-delay:90ms}
.choice:nth-child(3){animation-delay:140ms}
.choice:nth-child(4){animation-delay:190ms}
@keyframes choice-in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.choice::before{
  content:'';position:absolute;left:0;top:10px;bottom:10px;width:5px;
  border-radius:0 4px 4px 0;
  background:var(--acc);
  opacity:0;transform:scaleY(.3);
  transition:opacity var(--t-base) var(--ease),transform var(--t-base) var(--ease-out);
}
.choice:hover{
  background:var(--s-3);
  border-color:var(--acc);
  transform:translate(3px,-3px);
  box-shadow:var(--sh-card-hi);
}
.choice:hover::before,.choice:focus-visible::before{opacity:1;transform:none}
.choice:active{transform:translate(1px,2px);background:var(--s-4);box-shadow:var(--sh-card-lo)}
.choice.picked{background:var(--acc-wash);border-color:var(--acc);box-shadow:var(--sh-card)}

.choice-label{display:flex;align-items:center;gap:var(--sp-3)}
.choice-key{
  width:26px;height:26px;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  border-radius:var(--r-xs);
  background-color:var(--ink);
  background-image:radial-gradient(var(--dot) 1px,transparent 1px);
  background-size:5px 5px;
  border:2px solid var(--card-line);
  font-size:12px;font-weight:800;color:var(--yel);
  font-variant-numeric:tabular-nums;
  transition:transform var(--t-base) var(--ease-out),border-color var(--t-base) var(--ease);
}
.choice:hover .choice-key{transform:rotate(-6deg) scale(1.08)}
.choice.picked .choice-key{border-color:var(--acc)}
.choice-text{font-size:17px;font-weight:700;letter-spacing:-.01em;line-height:1.3}
.choice-sub{
  margin-top:5px;padding-left:34px;
  font-size:12.5px;line-height:1.5;color:var(--txt-3);
}

.choice-cost{
  display:flex;flex-wrap:wrap;gap:6px;
  margin-top:var(--sp-3);padding-left:34px;
}
.cost{
  display:inline-flex;align-items:center;gap:5px;
  padding:4px 9px;border-radius:var(--r-xs);
  font-size:11.5px;font-weight:600;
  font-variant-numeric:tabular-nums;
  background:var(--s-4);border:var(--bw) solid var(--line-2);
  color:var(--txt-2);white-space:nowrap;
}
.cost .ic svg{width:12px;height:12px;opacity:.75}
.cost.out{color:var(--neg);background:var(--neg-soft);border-color:var(--neg-line)}
.cost.in{color:var(--pos);background:var(--pos-soft);border-color:var(--pos-line)}
.cost.debt{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)}
.cost.flat{color:var(--txt-4)}

/* Что останется после решения */
.choice-after{
  flex:1 1 100%;
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  margin-top:2px;
}
.ca{display:inline-flex;align-items:baseline;gap:6px;font-size:11.5px}
.ca-lab{color:var(--txt-4)}
.ca-val{color:var(--txt-2);font-weight:600;font-variant-numeric:tabular-nums}
.ca.bad .ca-val{color:var(--neg)}
.ca-sep{width:3px;height:3px;border-radius:50%;background:var(--line-3);flex:none}

.choice-mark{
  position:absolute;right:var(--sp-4);top:50%;
  transform:translateY(-50%) translateX(-4px);
  color:var(--acc);opacity:0;
  transition:opacity var(--t-base) var(--ease),transform var(--t-base) var(--ease-out);
}
.choice:hover .choice-mark,.choice:focus-visible .choice-mark{opacity:1;transform:translateY(-50%)}
.choice-mark .ic svg{width:16px;height:16px}

/* --- Прогноз --- */

.forecast{
  padding:var(--sp-5);
  border-radius:var(--r-m);
  background:var(--s-2);
  border:var(--bw) solid var(--line-2);
}
.fc-q{font-size:16px;font-weight:600;letter-spacing:-.02em;line-height:1.35;margin-bottom:var(--sp-5)}
.fc-val{
  font-size:clamp(30px,3.4vw,42px);font-weight:800;letter-spacing:-.03em;
  text-align:center;color:var(--acc-hi);
  font-variant-numeric:tabular-nums;
  margin-bottom:var(--sp-4);
}
.fc-slider{
  -webkit-appearance:none;appearance:none;
  width:100%;height:8px;border-radius:99px;
  background:var(--line-2);
  outline:none;cursor:pointer;
}
.fc-slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:22px;height:22px;border-radius:50%;
  background:var(--acc);
  border:3px solid var(--s-1);
  box-shadow:0 0 0 2px var(--acc);
  cursor:grab;
  transition:transform var(--t-micro) var(--ease);
}
.fc-slider::-webkit-slider-thumb:active{transform:scale(1.14);cursor:grabbing}
.fc-slider::-moz-range-thumb{
  width:20px;height:20px;border-radius:50%;
  background:var(--acc);border:3px solid var(--s-1);
  box-shadow:0 0 0 2px var(--acc);cursor:grab;
}
.fc-scale{
  display:flex;justify-content:space-between;
  margin:8px 0 var(--sp-5);
  font-size:10.5px;color:var(--txt-4);font-variant-numeric:tabular-nums;
}
.forecast .primary-btn{width:100%}
.forecast .link-btn{display:flex;margin:var(--sp-3) auto 0}

.fc-result{animation:fade-up 320ms var(--ease-out) both}
.fc-badge{
  display:inline-flex;align-items:center;gap:6px;
  padding:5px 11px;border-radius:99px;
  font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:650;
  margin-bottom:var(--sp-4);
}
.fc-badge.good{background:var(--pos-soft);border:var(--bw) solid var(--pos-line);color:var(--pos)}
.fc-badge.off{background:var(--warn-soft);border:var(--bw) solid var(--warn-line);color:var(--warn)}
.fc-badge .ic svg{width:13px;height:13px}
.fc-cmp{
  border:var(--bw) solid var(--line);border-radius:var(--r-s);overflow:hidden;
  margin-bottom:var(--sp-4);
}
.fc-row{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);
  padding:10px 13px;background:var(--s-1);
  border-bottom:1px solid var(--line);
}
.fc-row:last-child{border-bottom:0}
.fc-row-lab{font-size:12px;color:var(--txt-3)}
.fc-row-val{font-size:14px;font-weight:640;font-variant-numeric:tabular-nums}
.fc-row.strong{background:var(--s-3)}
.fc-row.strong .fc-row-val{color:var(--acc-hi)}
.fc-reveal{
  font-size:13px;line-height:1.6;color:var(--txt-2);
  padding:var(--sp-4);border-radius:var(--r-s);
  background:var(--s-1);border-left:4px solid var(--acc);
  margin-bottom:var(--sp-4);
}

/* ==================================================================
   ЭКРАН ИТОГА
   ================================================================== */

.report .menu-wrap{padding-top:var(--sp-7)}

.verdict{
  position:relative;
  padding:var(--sp-8);
  border-radius:var(--r-xl);
  background:var(--s-1);
  border:var(--bw) solid var(--line-2);
  box-shadow:var(--sh-3);
  overflow:hidden;
  animation:fade-up 500ms var(--ease-out) both;
}
/* Полоса сверху — цвет итога: зачёт или мимо. Видно с последнего ряда. */
.verdict::before{
  content:'';position:absolute;left:0;right:0;top:0;height:8px;
  background:var(--pos);
}
.verdict.miss::before{background:var(--neg)}
/* Шапка карточки: чем именно была эта партия */
.verdict-head{
  display:flex;align-items:center;flex-wrap:wrap;gap:8px;
  position:relative;
}
.verdict-kicker{
  font-size:11px;letter-spacing:.26em;text-transform:uppercase;font-weight:650;
  color:var(--acc);
}
.verdict.miss .verdict-kicker{color:var(--neg)}
.vh-dot{width:4px;height:4px;border-radius:50%;background:var(--line-3);flex:none}
.verdict-scen{font-size:12.5px;font-weight:700;color:var(--txt-2)}
.verdict-level{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--txt-4);font-weight:700;
}

/* Балл и ранг стоят рядом, а не по разным краям широкой строки:
   раньше между ними зияла пустота во всю карточку. */
.score-row{
  display:flex;align-items:center;gap:var(--sp-7);
  flex-wrap:wrap;margin-top:var(--sp-4);position:relative;
}
.score-big{min-width:0}
.score-lab{margin-bottom:2px}
.score-num{
  display:flex;align-items:baseline;gap:10px;
  font-size:clamp(60px,7.6vw,104px);line-height:.92;font-weight:800;
  letter-spacing:-.04em;
  color:var(--txt);
  font-variant-numeric:tabular-nums;
  animation:score-in 700ms var(--ease-out) both;
}
.verdict.ok .score-num{color:var(--acc-hi)}
.score-max{
  font-size:20px;font-weight:700;letter-spacing:0;
  color:var(--txt-4);
}
@keyframes score-in{from{opacity:0;transform:translateY(16px) scale(.94)}to{opacity:1;transform:none}}
.score-name{
  margin-top:var(--sp-2);
  font-size:13px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--txt-3);font-weight:600;
}
.grade-box{
  display:flex;flex-direction:column;gap:2px;
  padding:var(--sp-4) var(--sp-5);
  border-radius:var(--r-m);
  background:var(--s-2);border:var(--bw) solid var(--line-2);
  min-width:150px;max-width:230px;
}
.verdict.ok .grade-box{border-color:var(--acc-line);background:var(--acc-dim)}
.grade-val{
  font-size:38px;font-weight:700;letter-spacing:-.04em;line-height:1;
  color:var(--acc-hi);
}
.grade-hint{margin-top:4px;font-size:11px;line-height:1.4;color:var(--txt-3)}

/* Вывод одной фразой — в правой половине строки, которая раньше пустовала */
.verdict-say{
  flex:1 1 260px;min-width:0;
  align-self:stretch;display:flex;flex-direction:column;justify-content:center;
  gap:6px;padding-left:var(--sp-5);
  border-left:2px solid var(--line);
}
.vs-lab{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--txt-4);font-weight:700;
}
.vs-text{font-size:14px;line-height:1.55;color:var(--txt-2);max-width:44ch}

/* Лестница рангов: буква сама по себе не говорит, близко ли это к пределу */
.grade-scale{
  display:flex;gap:4px;margin-top:var(--sp-5);position:relative;
}
.gs-cell{
  flex:1;text-align:center;
  padding:6px 0;border-radius:var(--r-xs);
  background:var(--s-2);border:1px solid var(--line);
  font-size:11.5px;font-weight:800;letter-spacing:.06em;
  color:var(--txt-4);
  transition:background var(--t-base) var(--ease),color var(--t-base) var(--ease);
}
.gs-cell.on{
  background:var(--acc);color:var(--acc-ink);border-color:var(--acc);
  box-shadow:var(--sh-card-lo);
}
.verdict.miss .gs-cell.on{background:var(--warn);border-color:var(--warn);color:var(--yel-ink)}

/* Числа итога: ровный ряд вместо разбросанных по краям подписей */
.verdict-facts{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));
  gap:1px;margin-top:var(--sp-6);
  background:var(--line);
  border:var(--bw) solid var(--line-2);border-radius:var(--r-m);
  overflow:hidden;position:relative;
}
.vfact{
  display:flex;flex-direction:column;gap:4px;
  padding:var(--sp-4);background:var(--s-1);
}
.vf-lab{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--txt-4);font-weight:700;
}
.vf-val{
  font-size:19px;font-weight:750;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;color:var(--txt);
}
.vfact.good .vf-val{color:var(--pos)}
.vfact.bad .vf-val{color:var(--neg)}
.vfact.warn .vf-val{color:var(--warn)}

.requirements{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(196px,1fr));gap:var(--sp-2);
  margin-top:var(--sp-4);position:relative;
}
.requirement{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:11px 14px;border-radius:var(--r-s);
  background:var(--s-1);border:var(--bw) solid var(--line);
  font-size:13px;
}
.requirement .req-mark{
  width:20px;height:20px;flex:none;border-radius:50%;
  display:inline-flex;align-items:center;justify-content:center;
}
.requirement .req-mark .ic svg{width:12px;height:12px}
.requirement.done{border-color:var(--pos-line)}
.requirement.done .req-mark{background:var(--pos-soft);color:var(--pos)}
.requirement.done .req-label{color:var(--txt-2)}
.requirement.miss .req-mark{background:var(--neg-soft);color:var(--neg)}
.requirement.miss .req-label{color:var(--txt-3)}

/* --- Четыре характеристики --- */

.final-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:var(--sp-3)}
.fstat{
  padding:var(--sp-4) var(--sp-5);
  border-radius:var(--r-m);
  background:var(--s-1);border:var(--bw) solid var(--line);
}
.fstat-head{display:flex;align-items:center;gap:8px;margin-bottom:var(--sp-3)}
.fstat-head .ic svg{width:15px;height:15px}
.fstat-name{color:var(--txt-3)}
.fstat-val{font-size:24px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-bottom:var(--sp-3)}
.fstat-track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.fstat-track i{display:block;height:100%;border-radius:99px;background:currentColor;
  animation:grow-x 800ms var(--ease-out) both;transform-origin:left}
.fstat-money{color:var(--c-money)}
.fstat-calm{color:var(--c-calm)}
.fstat-quality{color:var(--c-quality)}
.fstat-energy{color:var(--c-energy)}
.fstat .fstat-val{color:var(--txt)}

/* ==================================================================
   ГРАФИК ИТОГОВ: ЧЕТЫРЕ ЛИНИИ

   Своя партия — сплошная и с заливкой, три линии сравнения — тоньше и
   пунктиром, каждая своего рода: «если бы выбрали иначе», «идеальный
   выбор» и «среднестатистический». Свою линию видно первой в любом
   случае: она единственная закрашена снизу.
   ================================================================== */

.chart{
  /* Своей линии достаётся акцент темы, средней — фиолетовый: в светлой
     теме акцент и «информационный» синий почти неразличимы, и две линии
     сливались. Фиолетового в палитре игры больше нигде нет, поэтому он
     не спорит ни с одним другим смыслом. */
  --ln-avg:#7C5CE0;
  position:relative;
  padding:var(--sp-5);
  border-radius:var(--r-m);
  background:var(--s-1);border:var(--bw) solid var(--line);
}
.chart-svg{width:100%;height:auto;display:block;touch-action:pan-y}
.chart-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 6;vector-effect:non-scaling-stroke}
.chart-zero{stroke:var(--line-3);stroke-width:1;stroke-dasharray:4 4;vector-effect:non-scaling-stroke}
.chart-area{fill:var(--acc-dim);stroke:none}

.chart-line{
  fill:none;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;
  vector-effect:non-scaling-stroke;
  transition:opacity var(--t-micro) var(--ease);
}
.chart-line.off,.chart-mark.off{opacity:0;pointer-events:none}

.chart-line.ln-mine{
  stroke:var(--acc);stroke-width:2.4;
  stroke-dasharray:2600;stroke-dashoffset:2600;
  animation:draw 1600ms var(--ease-out) 200ms forwards;
}
.chart-line.ln-alt{stroke:var(--txt-4);stroke-dasharray:5 4}
.chart-line.ln-ideal{stroke:var(--pos);stroke-dasharray:1 5;stroke-width:2}
.chart-line.ln-avg{stroke:var(--ln-avg);stroke-dasharray:9 4;opacity:.85}
html[data-theme="dark"] .chart{--ln-avg:#B79BFF}

/* Наведение: вертикаль по месяцу и точка на каждой линии */
.chart-hover{opacity:0;transition:opacity var(--t-micro) var(--ease)}
.chart.live .chart-hover{opacity:1}
.chart-vline{stroke:var(--txt-4);stroke-width:1;stroke-dasharray:2 4;vector-effect:non-scaling-stroke}
.chart-mark{stroke:var(--s-1);stroke-width:2;vector-effect:non-scaling-stroke}
.chart-mark.m-mine{fill:var(--acc)}
.chart-mark.m-alt{fill:var(--txt-4)}
.chart-mark.m-ideal{fill:var(--pos)}
.chart-mark.m-avg{fill:var(--ln-avg)}

.chart-tip{
  position:absolute;bottom:auto;top:var(--sp-4);left:0;
  transform:translateX(-50%) translateY(-4px);
  min-width:186px;padding:9px 11px;
  border-radius:var(--r-s);
  background:var(--s-1);border:var(--bw) solid var(--card-line);
  box-shadow:var(--sh-card-lo);
  font-size:11.5px;line-height:1.5;
  opacity:0;pointer-events:none;
  transition:opacity var(--t-micro) var(--ease),transform var(--t-micro) var(--ease);
  z-index:2;
}
.chart.live .chart-tip{opacity:1;transform:translateX(-50%) translateY(0)}
.chart-tip.flip{transform:translateX(-100%) translateY(-4px);margin-left:26px}
.chart.live .chart-tip.flip{transform:translateX(-100%) translateY(0)}
.ct-when{
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--txt-4);font-weight:750;margin-bottom:6px;
}
.ct-row{display:flex;align-items:center;gap:7px;color:var(--txt-3)}
.ct-row.off{display:none}
.ct-row i{width:9px;height:9px;border-radius:50%;flex:none}
.ct-row.r-mine i{background:var(--acc)}
.ct-row.r-alt i{background:var(--txt-4)}
.ct-row.r-ideal i{background:var(--pos)}
.ct-row.r-avg i{background:var(--ln-avg)}
.ct-lab{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ct-val{color:var(--txt);font-weight:650;font-variant-numeric:tabular-nums}
.ct-gap{
  margin-top:6px;padding-top:5px;border-top:1px solid var(--line);
  font-size:10.5px;font-weight:700;color:var(--txt-3);
  font-variant-numeric:tabular-nums;
}
.ct-gap:empty{display:none}

/* Засечки месяцев, в которых что-то решалось. Янтарная — был вариант
   лучше выбранного, серая — ваш выбор оказался лучшим. По ним и понятно,
   куда на графике имеет смысл нажимать. */
.chart-how{
  display:inline-flex;align-items:center;gap:7px;margin-left:auto;
  font-size:11px;color:var(--txt-4);max-width:44ch;line-height:1.4;
}
.chart-how-tick{
  width:4px;height:11px;border-radius:2px;flex:none;
  background:linear-gradient(var(--warn) 0 100%);
}
@media (max-width:720px){.chart-how{margin-left:0}}

.chart-pick{fill:var(--line-3);opacity:.55}
.chart-pick.miss{fill:var(--warn);opacity:.95}
.chart.pinned .chart-hover{opacity:1}

/* ==================================================================
   РАЗБОР МЕСЯЦА ПОД ГРАФИКОМ

   Раскрывается по нажатию на график. Пока не нажали — блока нет вовсе,
   поэтому график выглядит ровно так же, как раньше.
   ================================================================== */

.chart-detail{display:none}
.chart-detail.on{display:block;margin-top:var(--sp-4)}
.md{
  padding:var(--sp-4);
  border-radius:var(--r-m);
  background:var(--s-2);
  border:var(--bw) solid var(--line-2);
  animation:fade-up 260ms var(--ease-out) both;
}
.md-head{
  display:flex;align-items:center;justify-content:space-between;
  gap:var(--sp-3);flex-wrap:wrap;
  padding-bottom:var(--sp-3);border-bottom:1px solid var(--line);
}
.md-when{
  font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--txt-4);font-weight:800;
}
.md-move{
  font-size:12.5px;font-weight:750;font-variant-numeric:tabular-nums;
  padding:3px 10px;border-radius:99px;
}
.md-move.up{color:var(--pos);background:var(--pos-soft)}
.md-move.down{color:var(--neg);background:var(--neg-soft)}

.md-none{margin-top:var(--sp-3);font-size:13px;color:var(--txt-3);line-height:1.5}

.md-choice{
  margin-top:var(--sp-3);padding:var(--sp-3) var(--sp-4);
  border-radius:var(--r-s);
  background:var(--s-1);
  border:1px solid var(--line);
  border-left:4px solid var(--pos);
}
.md-choice.miss{border-left-color:var(--warn)}
.md-ev{font-size:14px;font-weight:750;color:var(--txt);margin-bottom:6px}
.md-line{display:flex;gap:var(--sp-3);align-items:baseline;font-size:13px;line-height:1.5}
.md-lab{
  flex:none;width:96px;
  font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--txt-4);font-weight:750;
}
.md-line.best .md-lab{color:var(--warn)}
.md-val{color:var(--txt-2);min-width:0}
.md-line.best .md-val{color:var(--txt);font-weight:650}
.md-cost{
  margin-top:7px;font-size:12.5px;font-weight:700;
  font-variant-numeric:tabular-nums;color:var(--warn);
}
.md-cost.good{color:var(--pos);font-weight:650}

.md-sub{
  margin-top:var(--sp-4);
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--txt-4);font-weight:750;
}
.md-flows{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(184px,1fr));
  gap:2px var(--sp-4);margin-top:var(--sp-2);
}
.mdf,.mdn{
  display:flex;justify-content:space-between;gap:var(--sp-3);
  padding:5px 0;font-size:12.5px;
  border-bottom:1px solid var(--line);
}
.mdf-lab,.mdn-lab{color:var(--txt-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdf-val,.mdn-val{font-variant-numeric:tabular-nums;font-weight:700;flex:none}
.mdf.in .mdf-val,.mdn.in .mdn-val{color:var(--pos)}
.mdf.out .mdf-val,.mdn.out .mdn-val{color:var(--neg)}
.md-notes{margin-top:var(--sp-2)}
.md-total{
  display:flex;justify-content:space-between;gap:var(--sp-3);
  margin-top:var(--sp-3);padding-top:var(--sp-3);
  border-top:2px solid var(--line-2);
  font-size:13px;color:var(--txt-3);
}
.md-total b{font-variant-numeric:tabular-nums;color:var(--txt)}
.md-total.up b{color:var(--pos)}
.md-total.down b{color:var(--neg)}

@media (max-width:720px){
  .md-lab{width:78px}
  .md-flows{grid-template-columns:1fr}
}

/* Легенда переключает линии: четыре кривые разом читаются тяжело */
.chart-legend{
  display:flex;flex-wrap:wrap;gap:var(--sp-2) var(--sp-4);
  margin-top:var(--sp-4);font-size:11.5px;color:var(--txt-4);
  align-items:center;
}
.lg-item{
  display:inline-flex;align-items:center;gap:7px;
  padding:3px 8px;border-radius:99px;
  border:1px solid transparent;
  opacity:.42;transition:opacity var(--t-micro) var(--ease),background var(--t-micro) var(--ease);
}
.lg-item.on{opacity:1}
.lg-item:hover{background:var(--s-3)}
.lg-item:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.lg-line{width:18px;height:3px;border-radius:2px;background:var(--acc);flex:none}
.lg-alt .lg-line{background:repeating-linear-gradient(90deg,var(--txt-4) 0 5px,transparent 5px 9px)}
.lg-ideal .lg-line{background:repeating-linear-gradient(90deg,var(--pos) 0 2px,transparent 2px 6px)}
.lg-avg .lg-line{background:repeating-linear-gradient(90deg,var(--ln-avg) 0 9px,transparent 9px 13px)}
/* Подсказка «наведите» без маркера: в этой легенде кружок читался бы
   как ещё одна линия графика. */
.chart-legend .hv-hint{margin-left:auto}
.chart-legend .hv-hint::before{display:none}
.chart.live .hv-hint{opacity:0;transition:opacity 140ms var(--ease)}
/* Перекрестье заметнее: по нему читают, какой именно месяц под курсором. */
.chart-vline{stroke:var(--txt-3);stroke-width:1.4;stroke-dasharray:3 4}

@media (max-width:720px){
  .chart{padding:var(--sp-4)}
  .chart-tip{min-width:160px;font-size:11px}
  .chart-legend .hv-hint{display:none}
}

/* --- Альтернатива --- */

.counterfactual{
  margin-top:var(--sp-5);
  padding:var(--sp-6);
  border-radius:var(--r-m);
  background:var(--s-1);
  border:var(--bw) solid var(--line);
  border-left:4px solid var(--acc);
}
.cf-kicker{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-4);font-weight:650}
.cf-title{margin-top:6px;font-size:18px;font-weight:600;letter-spacing:-.02em}
.cf-lines{margin-top:var(--sp-4);border:var(--bw) solid var(--line);border-radius:var(--r-s);overflow:hidden}
.cf-row{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);
  padding:10px 13px;background:var(--s-2);border-bottom:1px solid var(--line);
}
.cf-row:last-child{border-bottom:0}
.cf-row-lab{font-size:11.5px;color:var(--txt-4);white-space:nowrap}
.cf-row-val{font-size:13px;font-weight:550;text-align:right}
.cf-delta{
  display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap;
  margin-top:var(--sp-4);padding-top:var(--sp-4);border-top:1px solid var(--line);
}
.cf-delta-num{font-size:26px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.cf-delta.worse .cf-delta-num{color:var(--neg)}
.cf-delta.better .cf-delta-num{color:var(--pos)}
.cf-delta-lab{font-size:12.5px;color:var(--txt-3)}

/* --- Ключевые события --- */

.moments{
  border:var(--bw) solid var(--line);border-radius:var(--r-m);overflow:hidden;
  background:var(--s-1);
}
.moment{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:11px var(--sp-5);
  border-bottom:1px solid var(--line);
  font-size:13px;
  animation:rec-in 340ms var(--ease-out) both;
}
.moment:last-child{border-bottom:0}
.mo-when{display:flex;flex-direction:column;line-height:1.1;flex:none;width:34px}
.mo-year{font-size:9px;letter-spacing:.1em;color:var(--acc);opacity:.8;font-weight:650}
.mo-month{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-4)}
.mo-dot{width:6px;height:6px;border-radius:50%;background:var(--line-3);flex:none}
.moment.good .mo-dot{background:var(--pos)}
.moment.bad .mo-dot{background:var(--neg)}
.moment.debt .mo-dot{background:var(--warn)}
.mo-text{flex:1;min-width:0;color:var(--txt-2);line-height:1.4}
.mo-amt{font-variant-numeric:tabular-nums;font-weight:600;color:var(--txt-3);white-space:nowrap}
.moment.good .mo-amt{color:var(--pos)}
.moment.bad .mo-amt{color:var(--neg)}

/* --- Исходы ставок --- */

.outcomes{border:var(--bw) solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--s-1)}
.outcome{
  display:flex;align-items:center;gap:var(--sp-3);
  padding:11px var(--sp-5);border-bottom:1px solid var(--line);font-size:13px;
}
.oc-month{
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--txt-4);
  width:34px;flex:none;
}
.oc-text{color:var(--txt-2);line-height:1.4}
.outcome.good .oc-text{color:var(--pos)}
.outcome.bad .oc-text{color:var(--neg)}
.outcomes-note{
  padding:var(--sp-4) var(--sp-5);font-size:12px;line-height:1.6;
  color:var(--txt-4);background:var(--s-2);
}

/* --- Потоки --- */

.flows{padding:var(--sp-5);border-radius:var(--r-m);background:var(--s-1);border:var(--bw) solid var(--line)}
.flows-head{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-4);
  margin-bottom:var(--sp-4);
}
.flows-lab{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-4);font-weight:650}
.flows-val{font-size:20px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.flows-track{
  display:flex;height:8px;border-radius:99px;overflow:hidden;
  background:var(--line);margin-bottom:var(--sp-4);
}
.seg{height:100%;animation:grow-x 800ms var(--ease-out) both;transform-origin:left}
.flow-row{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-4);
  padding:8px 0;border-bottom:1px solid var(--line);
  opacity:0;transform:translateY(4px);
  transition:opacity 340ms var(--ease-out),transform 340ms var(--ease-out);
}
.flow-row.in{opacity:1;transform:none}
.flow-row:last-child{border-bottom:0}
.flow-lab{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--txt-2);min-width:0}
.swatch{width:8px;height:8px;border-radius:2px;flex:none}
.flow-right{display:flex;align-items:baseline;gap:var(--sp-3);white-space:nowrap}
.flow-val{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.flow-pct{font-size:11px;color:var(--txt-4);font-variant-numeric:tabular-nums;width:34px;text-align:right}

.f-mand{background:#5B7FA8}
.f-food{background:#7FA9CE}
.f-debt{background:var(--warn)}
.f-int{background:#E08A5B}
.f-fee{background:var(--neg)}
.f-subs{background:var(--c-quality)}
.f-living{background:#9BB6CE}
.f-save{background:var(--pos)}
.f-shock{background:#B8443A}
.f-fun{background:var(--gold)}

.quiet-box{
  margin-top:var(--sp-4);
  padding:var(--sp-5) var(--sp-6);
  border-radius:var(--r-m);
  background:var(--viol-soft);
  border:var(--bw) solid var(--viol-line);
}
.quiet-lab{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--c-quality);font-weight:650}
.quiet-num{font-size:28px;font-weight:600;letter-spacing:-.03em;margin:6px 0 var(--sp-3);font-variant-numeric:tabular-nums}
.quiet-note{font-size:12.5px;line-height:1.6;color:var(--txt-3)}

/* --- KPI --- */

.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:var(--sp-2)}
.kpi{
  padding:var(--sp-4);border-radius:var(--r-s);
  background:var(--s-1);border:var(--bw) solid var(--line);
  border-top:4px solid var(--line-2);
}
.kpi.good{border-top-color:var(--pos)}
.kpi.bad{border-top-color:var(--neg)}
.kpi-val{font-size:17px;font-weight:640;letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-bottom:4px}
.kpi-lab{font-size:9.5px;letter-spacing:.1em}

/* --- Чипы карточек знаний --- */

.concept-chips{display:flex;flex-wrap:wrap;gap:var(--sp-2)}
.cchip{
  display:inline-flex;align-items:center;gap:6px;
  padding:8px 13px;border-radius:99px;
  background:var(--s-2);border:var(--bw) solid var(--line-2);
  font-size:12.5px;color:var(--txt-2);
  transition:background var(--t-micro) var(--ease),border-color var(--t-micro) var(--ease),color var(--t-micro) var(--ease);
}
.cchip .ic svg{width:13px;height:13px;color:var(--acc);opacity:.7}
.cchip:hover{background:var(--s-3);border-color:var(--acc-line);color:var(--txt)}
.cchip:active{transform:translateY(1px)}

.actions{display:flex;flex-wrap:wrap;gap:var(--sp-3);margin-top:var(--sp-8)}

/* ==================================================================
   КОШЕЛЁК: резерв и досрочное погашение
   ================================================================== */

.wallet-panel{
  border-radius:var(--r-l);
  background:var(--s-1);
  border:var(--bw) solid var(--line);
  overflow:hidden;
}
.wl-body{padding:var(--sp-3) var(--sp-4) var(--sp-4);display:flex;flex-direction:column;gap:6px}
.wl-row{
  padding:10px 11px;
  border-radius:var(--r-s);
  background:var(--s-2);
  border:var(--bw) solid var(--line);
  border-left:4px solid var(--c-calm);
}
.wl-row.debt{border-left-color:var(--warn)}
.wl-top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3)}
.wl-name{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--txt-2);min-width:0}
.wl-name .ic svg{width:14px;height:14px;opacity:.8}
.wl-name span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wl-val{font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums;white-space:nowrap}
.wl-val.neg{color:var(--neg)}
.wl-hint{font-size:10.5px;color:var(--txt-4);margin-top:3px}
.wl-acts{display:flex;gap:6px;margin-top:8px}
.wl-act{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:5px;
  padding:6px 8px;border-radius:var(--r-xs);
  background:var(--s-3);border:var(--bw) solid var(--line-2);
  color:var(--txt-3);font-size:11.5px;font-weight:550;
  transition:background var(--t-micro) var(--ease),color var(--t-micro) var(--ease),border-color var(--t-micro) var(--ease);
}
.wl-act .ic svg{width:12px;height:12px}
.wl-act:hover:not(:disabled){background:var(--s-4);color:var(--txt);border-color:var(--line-3)}
.wl-act.strong:hover:not(:disabled){border-color:var(--acc-line);color:var(--acc-hi);background:var(--acc-dim)}
.wl-act:disabled{opacity:.38}
.wl-empty{
  display:flex;align-items:center;gap:8px;
  padding:10px 11px;font-size:12px;color:var(--txt-4);
}
.wl-empty .ic svg{width:14px;height:14px;color:var(--pos);opacity:.8}

/* Форма выбора суммы */
.amount-form{
  margin-top:var(--sp-3);padding-top:var(--sp-3);
  border-top:1px solid var(--line);
  animation:fade-up 220ms var(--ease-out) both;
}
.af-title{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-4);font-weight:650}
.af-val{
  font-size:24px;font-weight:800;letter-spacing:-.025em;
  color:var(--acc-hi);font-variant-numeric:tabular-nums;
  margin:4px 0 var(--sp-3);
}
.af-hint{font-size:11px;line-height:1.5;color:var(--txt-4);margin:var(--sp-3) 0}
.amount-form .primary-btn{width:100%}
.amount-form .link-btn{display:flex;margin:6px auto 0}
.amount-form .bf-presets{margin-bottom:0}

/* ==================================================================
   ПОРТФЕЛЬ И БИРЖА
   ================================================================== */

.portfolio-panel{
  border-radius:var(--r-l);
  background:var(--s-1);
  border:var(--bw) solid var(--line);
  overflow:hidden;
}
.pf-body{padding:var(--sp-3) var(--sp-4) var(--sp-4)}

.pf-empty{
  display:flex;align-items:flex-start;gap:var(--sp-3);
  padding:var(--sp-3) var(--sp-2) var(--sp-4);
  color:var(--txt-4);
}
.pf-empty-ic{color:var(--acc);opacity:.5;margin-top:1px}
.pf-empty-ic svg{width:18px;height:18px}
.pf-empty-text{font-size:12px;line-height:1.5}

.pf-list{display:flex;flex-direction:column;gap:6px}
.pf-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:2px var(--sp-3);
  padding:10px 11px;
  border-radius:var(--r-s);
  background:var(--s-2);
  border:var(--bw) solid var(--line);
  border-left:4px solid var(--line-3);
}
.pf-row.up{border-left-color:var(--pos)}
.pf-row.down{border-left-color:var(--neg)}
.pf-main{min-width:0;display:flex;flex-direction:column;gap:2px}
.pf-name{font-size:12.5px;font-weight:600;letter-spacing:-.01em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf-units{font-size:10.5px;color:var(--txt-4)}
.pf-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap}
.pf-val{font-size:13px;font-weight:640;font-variant-numeric:tabular-nums}
.pf-pnl{font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}
.pf-row.up .pf-pnl{color:var(--pos)}
.pf-row.down .pf-pnl{color:var(--neg)}
.pf-acts{grid-column:1 / -1;display:flex;gap:6px;margin-top:6px}
.pf-act{
  flex:1;padding:6px 8px;border-radius:var(--r-xs);
  background:var(--s-3);border:var(--bw) solid var(--line-2);
  color:var(--txt-3);font-size:11px;font-weight:550;
  transition:background var(--t-micro) var(--ease),color var(--t-micro) var(--ease),border-color var(--t-micro) var(--ease);
}
.pf-act:hover:not(:disabled){background:var(--s-4);color:var(--txt);border-color:var(--line-3)}
.pf-act.strong:hover:not(:disabled){border-color:var(--neg-line);color:var(--neg)}
.pf-act:disabled{opacity:.4}

.pf-sum{
  display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);
  margin-top:var(--sp-3);padding-top:var(--sp-3);
  border-top:1px solid var(--line);
  font-size:11.5px;color:var(--txt-4);
}
.pf-sum-val{font-size:13px;font-weight:650;font-variant-numeric:tabular-nums}
.pf-sum.up .pf-sum-val{color:var(--pos)}
.pf-sum.down .pf-sum-val{color:var(--neg)}

.pf-open{
  display:flex;align-items:center;gap:8px;width:100%;
  margin-top:var(--sp-3);padding:10px 12px;
  border-radius:var(--r-s);
  background:var(--acc-dim);border:var(--bw) solid var(--acc-line);
  color:var(--acc-hi);font-size:12.5px;font-weight:600;
  transition:background var(--t-micro) var(--ease);
}
.pf-open .ic:last-child{margin-left:auto;transition:transform var(--t-micro) var(--ease-out)}
.pf-open:hover:not(:disabled){background:var(--acc-dim-2)}
.pf-open:hover:not(:disabled) .ic:last-child{transform:translateX(3px)}
.pf-open:disabled{opacity:.4;background:var(--s-2);border-color:var(--line);color:var(--txt-4)}

/* --- Модальное окно биржи --- */

.exchange-wrap{align-items:center}
.modal.exchange{
  max-width:840px;width:100%;
  max-height:88vh;
  padding:0;
  display:flex;flex-direction:column;
  overflow:hidden;
}
.ex-head{
  display:grid;
  grid-template-columns:auto 1fr auto auto;
  align-items:center;gap:var(--sp-4);
  padding:var(--sp-4) var(--sp-5);
  border-bottom:1px solid var(--line);
  background:var(--s-2);
  flex:none;
}
.ex-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:640;letter-spacing:-.02em}
.ex-title .ic{color:var(--acc)}
.ex-when{font-size:11.5px;color:var(--txt-4)}
.ex-cash{display:flex;flex-direction:column;align-items:flex-end;gap:1px}
.ex-cash-lab{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-4);font-weight:600}
.ex-cash-val{font-size:15px;font-weight:640;font-variant-numeric:tabular-nums}
.ex-close{
  width:32px;height:32px;border-radius:var(--r-s);
  display:inline-flex;align-items:center;justify-content:center;
  color:var(--txt-4);border:1px solid transparent;
  transition:color var(--t-micro) var(--ease),background var(--t-micro) var(--ease),border-color var(--t-micro) var(--ease);
}
.ex-close:hover{color:var(--txt);background:var(--s-3);border-color:var(--line-2)}

.ex-scroll{overflow-y:auto;padding:var(--sp-5);min-height:0}
.ex-note{
  display:flex;align-items:flex-start;gap:8px;
  padding:10px 12px;margin-bottom:var(--sp-5);
  border-radius:var(--r-s);
  background:var(--s-2);border:var(--bw) solid var(--line);
  font-size:11.5px;line-height:1.5;color:var(--txt-4);
}
.ex-note .ic{margin-top:1px}
.ex-note .ic svg{width:13px;height:13px;color:var(--warn);opacity:.8}

.ex-section{
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--txt-3);font-weight:650;
  margin:var(--sp-5) 0 var(--sp-3);
  display:flex;align-items:center;gap:var(--sp-3);
}
.ex-section:first-child{margin-top:0}
.ex-section::after{content:'';flex:1;height:2px;border-radius:2px;background:var(--line)}
.ex-group{
  font-size:11px;color:var(--txt-4);font-weight:600;
  margin:var(--sp-4) 0 var(--sp-2);letter-spacing:.04em;
}

/* Позиция игрока в модальном окне */
.ex-positions{display:flex;flex-direction:column;gap:var(--sp-3)}
.ex-pos{
  padding:var(--sp-4);
  border-radius:var(--r-m);
  background:var(--s-2);
  border:var(--bw) solid var(--line-2);
  border-left:4px solid var(--line-3);
}
.ex-pos.up{border-left-color:var(--pos)}
.ex-pos.down{border-left-color:var(--neg)}
.exp-top{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);margin-bottom:var(--sp-3)}
.exp-name{font-size:15px;font-weight:640;letter-spacing:-.015em}
.exp-pct{font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.ex-pos.up .exp-pct{color:var(--pos)}
.ex-pos.down .exp-pct{color:var(--neg)}
.exp-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:1px;
  background:var(--line);border:var(--bw) solid var(--line);border-radius:var(--r-s);
  overflow:hidden;margin-bottom:var(--sp-3);
}
.exp-cell{background:var(--s-1);padding:8px 10px;display:flex;flex-direction:column;gap:2px}
/* Нечётная последняя ячейка не оставляет дырку в сетке */
.exp-cell:last-child:nth-child(odd){grid-column:1 / -1}
.expc-lab{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--txt-4);font-weight:600}
.expc-val{font-size:13px;font-weight:640;font-variant-numeric:tabular-nums}
.exp-cell.good .expc-val{color:var(--pos)}
.exp-cell.bad .expc-val{color:var(--neg)}
.exp-hint{font-size:11.5px;line-height:1.5;color:var(--txt-4);margin-bottom:var(--sp-3)}
.exp-acts{display:flex;flex-wrap:wrap;gap:var(--sp-2)}

.ghost-btn.small{height:36px;padding:0 var(--sp-4);font-size:12.5px}
.primary-btn.small{height:38px;padding:0 var(--sp-4);font-size:13px}
.ghost-btn.danger:hover{border-color:var(--neg-line);color:var(--neg);background:var(--neg-soft)}

/* Карточка инструмента */
.ex-item{
  padding:var(--sp-4);
  border-radius:var(--r-m);
  background:var(--s-1);
  border:var(--bw) solid var(--line);
  margin-bottom:var(--sp-2);
  transition:border-color var(--t-base) var(--ease),background var(--t-base) var(--ease);
}
.ex-item:hover{border-color:var(--line-3);background:var(--s-2)}
.exi-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--sp-3);margin-bottom:4px}
.exi-name-wrap{display:flex;align-items:baseline;gap:8px;min-width:0;flex-wrap:wrap}
.exi-name{font-size:15px;font-weight:640;letter-spacing:-.015em}
.exi-ticker{
  font-size:9.5px;letter-spacing:.12em;font-weight:700;
  padding:2px 6px;border-radius:var(--r-xs);
  background:var(--s-3);border:var(--bw) solid var(--line-2);color:var(--txt-4);
}
.exi-desc{font-size:12px;line-height:1.5;color:var(--txt-4);margin-bottom:var(--sp-3)}

/* Цена и изменение — как в биржевом терминале */
.exi-price{display:flex;flex-direction:column;align-items:flex-start;gap:7px;margin:2px 0 var(--sp-3)}
.exip-val{
  font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;
  letter-spacing:-.03em;line-height:1;color:var(--txt);
}
.exip-chg{
  display:inline-flex;align-items:center;gap:4px;
  padding:2px 7px;border-radius:var(--r-xs);
  font-size:11.5px;font-weight:650;font-variant-numeric:tabular-nums;
}
.exip-chg .ic svg{width:12px;height:12px}
.exip-chg.up{color:var(--pos);background:var(--pos-soft)}
.exip-chg.down{color:var(--neg);background:var(--neg-soft)}
/* Внутри чипа три величины: процент, рубли и период — как в приложении
   брокера. Проценты и рубли в цвет движения, период приглушён: он не
   новость, а рамка, в которой считаются первые два числа. */
.exip-pct{font-weight:750}
.exip-abs{opacity:.9}
.exip-per{
  margin-left:2px;padding-left:7px;
  border-left:1px solid currentColor;
  opacity:.55;font-weight:700;letter-spacing:.06em;
}

/* ==================================================================
   СВЕЧНОЙ ГРАФИК

   Как в биржевом приложении: только свечи на чистом фоне, редкая
   пунктирная сетка, цены справа за полем свечей и ярлык текущей цены.
   Пропорции не растягиваются под ширину карточки — высота идёт за
   viewBox, поэтому свеча остаётся свечой и на узком экране.
   ================================================================== */

.exi-chart{
  width:100%;min-height:64px;margin-bottom:var(--sp-3);
  position:relative;
  touch-action:pan-y;
}
.candle-svg{
  width:100%;height:auto;display:block;overflow:visible;
  --up:#26C77E;
  --down:#F5473D;
}
html[data-theme="dark"] .candle-svg{--up:#2ED47A;--down:#FF4D45}

.candle-grid{
  stroke:var(--line);stroke-width:1;stroke-dasharray:1 5;
  opacity:.7;vector-effect:non-scaling-stroke;
}
.candle-axis{
  fill:var(--txt-4);font-size:10px;font-family:inherit;
  font-variant-numeric:tabular-nums;dominant-baseline:middle;text-anchor:end;
}
.candle-time{
  fill:var(--txt-4);font-size:10px;font-family:inherit;letter-spacing:.04em;
}

.candle.wick{stroke-width:1.1;vector-effect:non-scaling-stroke}
.candle.up{stroke:var(--up)}
.candle.down{stroke:var(--down)}
.candle.body.up{fill:var(--up);stroke:none}
.candle.body.down{fill:var(--down);stroke:none}

/* Текущая цена: пунктир в цвет тренда и ярлык на шкале */
.candle-last{
  stroke:var(--up);stroke-width:1;stroke-dasharray:3 4;opacity:.75;
  vector-effect:non-scaling-stroke;
}
.candle-svg.down .candle-last{stroke:var(--down)}
.candle-pill rect{fill:var(--up);stroke:none}
.candle-svg.down .candle-pill rect{fill:var(--down)}
.candle-pill text{
  fill:#fff;font-size:10px;font-weight:700;font-family:inherit;
  font-variant-numeric:tabular-nums;text-anchor:end;
}

/* Наведение: перекрестье, подсветка свечи и подсказка */
.candle-hover{opacity:0;transition:opacity var(--t-micro) var(--ease)}
.exi-chart.live .candle-hover{opacity:1}
.candle-vline{stroke:var(--txt-3);stroke-width:1;stroke-dasharray:2 4;vector-effect:non-scaling-stroke}
.candle-halo{fill:var(--txt);opacity:.14}

.cd-tip{
  position:absolute;bottom:calc(100% - 12px);left:0;
  transform:translateX(-50%) translateY(4px);
  min-width:152px;padding:8px 10px;
  border-radius:var(--r-s);
  background:var(--s-1);border:var(--bw) solid var(--card-line);
  box-shadow:var(--sh-card-lo);
  font-size:11.5px;line-height:1.45;
  opacity:0;pointer-events:none;
  transition:opacity var(--t-micro) var(--ease),transform var(--t-micro) var(--ease);
  z-index:3;
}
.cd-tip.flip{transform:translateX(-100%) translateY(4px);left:auto;margin-left:24px}
.exi-chart.live .cd-tip{opacity:1;transform:translateX(-50%) translateY(0)}
.exi-chart.live .cd-tip.flip{transform:translateX(-100%) translateY(0)}
.cdt-when{
  font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--txt-4);font-weight:750;margin-bottom:5px;
}
.cdt-row{display:flex;justify-content:space-between;gap:12px;color:var(--txt-3)}
.cdt-row b{color:var(--txt);font-variant-numeric:tabular-nums;font-weight:650}
.cdt-row.close{margin-top:3px;padding-top:4px;border-top:1px solid var(--line)}
.cdt-delta{
  margin-top:5px;font-size:10.5px;font-weight:700;
  font-variant-numeric:tabular-nums;
}
.cdt-delta.up{color:var(--pos)}
.cdt-delta.down{color:var(--neg)}

.chart-empty{
  min-height:120px;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;color:var(--txt-4);
  border:1px dashed var(--line-2);border-radius:var(--r-s);
}

/* ==================================================================
   НАКОПИТЕЛЬНЫЙ СЧЁТ

   Первый блок биржи: место для денег, которые нельзя потерять. Раньше
   его роль играл «вклад» — бумага с нулевым колебанием цены, дававшая
   безрисковый доход навсегда одним нажатием.
   ================================================================== */

.sav-card{
  padding:var(--sp-4);margin-bottom:var(--sp-4);
  border-radius:var(--r-m);
  background:var(--s-1);
  border:var(--bw) solid var(--card-line);
  box-shadow:var(--sh-card-lo);
}
.sav-head{display:flex;align-items:center;gap:var(--sp-3);flex-wrap:wrap}
.sav-title{
  display:inline-flex;align-items:center;gap:7px;
  font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
  color:var(--txt);
}
.sav-title .ic svg{width:15px;height:15px;color:var(--pos)}
.sav-rate{
  margin-left:auto;font-size:10.5px;font-weight:700;
  padding:3px 9px;border-radius:99px;
  background:var(--pos-soft);color:var(--pos);
  border:1px solid var(--pos-line);
  font-variant-numeric:tabular-nums;
}
.sav-card.plain .sav-rate{background:var(--s-3);color:var(--txt-3);border-color:var(--line-2)}
.sav-sum{display:flex;align-items:baseline;gap:var(--sp-3);flex-wrap:wrap;margin-top:var(--sp-3)}
.sav-bal{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--txt)}
.sav-earned{font-size:11.5px;color:var(--pos);font-weight:650}
.sav-state{
  display:flex;align-items:flex-start;gap:7px;
  margin-top:var(--sp-3);padding:8px 10px;
  border-radius:var(--r-s);font-size:11.5px;line-height:1.45;
}
.sav-state.ok{background:var(--pos-soft);color:var(--pos)}
.sav-state.warn{background:var(--warn-soft);color:var(--warn)}
.sav-state .ic{margin-top:1px}
.sav-state .ic svg{width:13px;height:13px}
.sav-hint{
  margin-top:var(--sp-2);font-size:11px;line-height:1.5;color:var(--txt-4);
}
.sav-acts{display:flex;gap:var(--sp-2);margin-top:var(--sp-3);flex-wrap:wrap}
.sav-form:empty{display:none}
.sav-form{margin-top:var(--sp-3)}

/* Сводка по всему портфелю: одной строкой, без сложения в уме */
.ex-total{
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  margin-bottom:var(--sp-3);
  background:var(--line);border:var(--bw) solid var(--card-line);
  border-radius:var(--r-s);overflow:hidden;
}
.ex-total.up{border-left:4px solid var(--pos)}
.ex-total.down{border-left:4px solid var(--neg)}

/* Уровень риска бумаги — рядом с ценой, а не в описании */
.exi-risk{display:flex;align-items:center;gap:8px;margin-bottom:var(--sp-3)}
.exir-lab{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-4)}
.exir-meter{display:inline-flex;gap:3px}
.exir-meter i{width:13px;height:5px;border-radius:3px;background:var(--line-2)}
.exir-meter i.on{background:var(--warn)}
.exi-risk.r0 .exir-meter i.on,.exi-risk.r1 .exir-meter i.on{background:var(--pos)}
.exi-risk.r5 .exir-meter i.on,.exi-risk.r6 .exir-meter i.on{background:var(--neg)}
.exir-val{font-size:11px;color:var(--txt-3);margin-left:auto}

@media (max-width:720px){
  .ex-total{grid-template-columns:repeat(2,1fr)}
  .cd-tip{min-width:130px;font-size:11px}
}

/* Переключатель периода */
.ex-periods{
  display:flex;gap:4px;flex:none;
  padding:var(--sp-3) var(--sp-5);
  border-bottom:1px solid var(--line);
  background:var(--s-1);
}
.ex-period{
  padding:5px 13px;border-radius:var(--r-xs);
  font-size:12px;font-weight:600;color:var(--txt-4);
  border:1px solid transparent;
  transition:background var(--t-micro) var(--ease),color var(--t-micro) var(--ease),border-color var(--t-micro) var(--ease);
}
.ex-period:hover{color:var(--txt-2);background:var(--s-3)}
.ex-period.on{background:var(--acc-dim-2);color:var(--acc-hi);border-color:var(--acc-line)}

.exi-buy{margin-bottom:6px}
.exi-more{
  font-size:11.5px;color:var(--txt-4);
  padding:4px 0;
  transition:color var(--t-micro) var(--ease);
}
.exi-more:hover,.exi-more.on{color:var(--acc)}
.exi-full{
  margin-top:8px;padding:var(--sp-3) var(--sp-4);
  border-radius:var(--r-s);
  background:var(--s-2);border-left:4px solid var(--acc);
  font-size:12.5px;line-height:1.65;color:var(--txt-2);
  animation:fade-up 240ms var(--ease-out) both;
}

/* Форма покупки */
.buy-form{
  padding:var(--sp-4);
  border-radius:var(--r-s);
  background:var(--s-2);
  border:var(--bw) solid var(--line-2);
  animation:fade-up 240ms var(--ease-out) both;
}
.bf-lab{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--txt-4);font-weight:650}
.bf-val{
  font-size:30px;font-weight:800;letter-spacing:-.025em;
  color:var(--acc-hi);font-variant-numeric:tabular-nums;
  margin:4px 0 var(--sp-3);
}
.bf-presets{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--sp-3)}
.bf-preset{
  padding:5px 10px;border-radius:99px;
  background:var(--s-3);border:var(--bw) solid var(--line-2);
  color:var(--txt-3);font-size:11.5px;font-variant-numeric:tabular-nums;
  transition:background var(--t-micro) var(--ease),color var(--t-micro) var(--ease),border-color var(--t-micro) var(--ease);
}
.bf-preset:hover{background:var(--acc-dim);border-color:var(--acc-line);color:var(--acc-hi)}
.bf-row{
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
  padding:6px 0;font-size:12.5px;border-bottom:1px solid var(--line);
}
.bf-row:last-of-type{border-bottom:0;margin-bottom:var(--sp-3)}
.bf-row-lab{color:var(--txt-4)}
.bf-row-val{font-weight:640;font-variant-numeric:tabular-nums}
.bf-row.bad .bf-row-val{color:var(--neg)}
.buy-form .primary-btn{width:100%;margin-top:var(--sp-2)}
.buy-form .link-btn{display:flex;margin:8px auto 0}

/* Низ карточки инструмента: пояснение слева, покупка справа */
.exi-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap}
.exi-foot.open{display:block}
.exi-foot.open .exi-more{margin-bottom:var(--sp-3)}
.exi-buy{margin:0}
.exi-more{display:inline-flex;align-items:center;gap:6px}
.exi-more .ic svg{width:13px;height:13px}

/* Действия по позиции раскрываются по клику — иначе панель занимает пол-экрана */
.pf-row{cursor:pointer}
.pf-row .pf-acts{display:none}
.pf-row.open .pf-acts{display:flex;animation:fade-up 200ms var(--ease-out) both}
.pf-row:hover{border-color:var(--line-3)}

/* Когда портфель не пуст, правая колонка делит высоту с хроникой.
   Только на десктопе: на телефоне у ленты нет своего скроллера, и ограничение
   высоты просто прятало бы часть хроники за пределами документа.
   Селектор из двух классов перебивал бы мобильное правило по специфичности,
   поэтому ограничиваем его медиазапросом, а не порядком в файле. */

/* Итог вложений в отчёте */
.invest-sum{display:flex;flex-direction:column;gap:var(--sp-3)}
.invest-list{
  border:var(--bw) solid var(--line);border-radius:var(--r-m);overflow:hidden;background:var(--s-1);
}
.invest-row{
  display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr) auto auto;
  align-items:center;gap:var(--sp-3);
  padding:11px var(--sp-5);border-bottom:1px solid var(--line);font-size:13px;
}
.invest-row:last-child{border-bottom:0}
.ir-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ir-cost{font-size:11.5px;color:var(--txt-4)}
.ir-val{font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.ir-pct{font-variant-numeric:tabular-nums;font-weight:650;white-space:nowrap;min-width:64px;text-align:right}
.invest-row.up .ir-pct{color:var(--pos)}
.invest-row.down .ir-pct{color:var(--neg)}
.invest-note{
  font-size:12.5px;line-height:1.65;color:var(--txt-3);
  padding:var(--sp-4) var(--sp-5);border-radius:var(--r-m);
  background:var(--s-1);border:var(--bw) solid var(--line);border-left:4px solid var(--acc);
}

/* ==================================================================
   БИБЛИОТЕКА И «О ПРИЛОЖЕНИИ»
   ================================================================== */

.page-head{margin-bottom:var(--sp-7)}
.page-title{font-size:clamp(28px,3.2vw,40px);font-weight:800;letter-spacing:-.03em}
.page-sub{margin-top:var(--sp-3);font-size:14px;color:var(--txt-3);max-width:58ch;line-height:1.6}

.library-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--sp-3)}
.concept{
  padding:var(--sp-5);border-radius:var(--r-m);
  background:var(--s-1);border:var(--bw) solid var(--line);
  transition:background var(--t-base) var(--ease),border-color var(--t-base) var(--ease),transform var(--t-micro) var(--ease);
}
.concept.tappable{cursor:pointer}
@media (hover:hover) and (pointer:fine){
  .concept.known:hover{background:var(--s-2);border-color:var(--line-3);transform:translateY(-2px)}
}
.concept.open{border-color:var(--acc-line);background:var(--s-2)}
.concept.locked{opacity:.5}
.concept-top{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);margin-bottom:8px}
.concept-title{font-size:15.5px;font-weight:600;letter-spacing:-.015em}
.concept-mark{
  width:22px;height:22px;border-radius:50%;flex:none;
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--s-3);color:var(--txt-4);
}
.concept-mark .ic svg{width:12px;height:12px}
.concept.known .concept-mark{background:var(--pos-soft);color:var(--pos)}
.concept-short{font-size:12.5px;line-height:1.5;color:var(--txt-3)}
.concept-body{
  margin-top:var(--sp-4);padding-top:var(--sp-4);
  border-top:1px solid var(--line);
  font-size:13px;line-height:1.7;color:var(--txt-2);
  animation:fade-up 260ms var(--ease-out) both;
}

/* Счётчик и слоты коллекции в библиотеке */
.lib-counter{
  display:grid;grid-template-columns:auto auto 1fr;align-items:center;gap:var(--sp-3);
  margin-bottom:var(--sp-5);padding:var(--sp-4) var(--sp-5);
  border-radius:var(--r-m);background:var(--s-1);border:var(--bw) solid var(--line);
}
.lc-num{font-size:19px;font-weight:640;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lc-lab{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--txt-4);font-weight:600}
.lc-track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.lc-track i{display:block;height:100%;border-radius:99px;
  background:var(--acc);
  animation:grow-x 800ms var(--ease-out) both;transform-origin:left}

.concept.locked{
  opacity:1;
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--sp-4) var(--sp-5);
  min-height:0;
  background:var(--s-2);
  border-style:dashed;
}
.concept-slot{
  font-size:16px;font-weight:700;letter-spacing:-.015em;
  color:var(--txt-4);font-variant-numeric:tabular-nums;
}
.slot-lock{color:var(--txt-4);opacity:.55}
.slot-lock svg{width:14px;height:14px}
.library-grid{align-items:start}

.about-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:var(--sp-3)}
.about-block{
  padding:var(--sp-5);border-radius:var(--r-m);
  background:var(--s-1);border:var(--bw) solid var(--line);
}
.about-title{font-size:14px;font-weight:640;margin-bottom:8px;letter-spacing:-.01em}
.about-text{font-size:13px;line-height:1.7;color:var(--txt-3)}

.danger-zone{
  margin-top:var(--sp-6);
  padding:var(--sp-5) var(--sp-6);
  border-radius:var(--r-m);
  background:var(--neg-soft);
  border:var(--bw) solid var(--neg-line);
}
.dz-title{font-size:13px;font-weight:640;color:var(--neg);margin-bottom:6px}
.dz-text{font-size:12.5px;line-height:1.6;color:var(--txt-3);margin-bottom:var(--sp-4);max-width:56ch}

.back-btn{margin-top:var(--sp-7)}

/* ==================================================================
   МОДАЛЬНОЕ ОКНО
   ================================================================== */

.modal-wrap{
  position:fixed;inset:0;z-index:200;
  display:flex;align-items:center;justify-content:center;
  padding:var(--sp-6);
  background:var(--scrim);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;transition:opacity var(--t-base) var(--ease);
}
.modal-wrap.in{opacity:1}
.modal{
  width:100%;max-width:520px;
  padding:var(--sp-7);
  border-radius:var(--r-xl);
  background:var(--s-1);border:var(--bw) solid var(--line-2);
  box-shadow:var(--sh-4);
  transform:translateY(14px) scale(.98);
  transition:transform var(--t-base) var(--ease-out);
}
.modal-wrap.in .modal{transform:none}
.modal-kicker{
  display:inline-flex;align-items:center;gap:6px;
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--acc);font-weight:650;
}
.modal-kicker .ic svg{width:13px;height:13px}
.modal-title{margin-top:var(--sp-3);font-size:24px;font-weight:600;letter-spacing:-.03em}
.modal-short{margin-top:8px;font-size:13.5px;color:var(--txt-3)}
.modal-text{margin:var(--sp-5) 0 var(--sp-6);font-size:14px;line-height:1.75;color:var(--txt-2)}
.modal:not(.exchange) .primary-btn{width:100%}

/* Пока открыто модальное окно или шторка решения, страница под ними
   не должна ездить: иначе закрываешь окно и оказываешься в другом месте. */
html.scroll-locked, body.scroll-locked{
  overflow:hidden;
  overscroll-behavior:none;
}

/* ==================================================================
   ПОЛОСА ОШИБОК

   Раньше сбои молча глотались пустыми try/catch: игра продолжала идти
   «почти правильно», и понять, что именно сломалось, было невозможно.
   Теперь любая необработанная ошибка видна прямо на экране — и в игре,
   и на проекторе в классе.
   ================================================================== */

.err-strip{
  position:fixed;left:var(--sp-4);right:var(--sp-4);
  bottom:calc(var(--sp-4) + env(safe-area-inset-bottom));
  z-index:400;
  display:flex;align-items:flex-start;gap:var(--sp-3);
  max-width:720px;margin:0 auto;
  padding:12px 14px;
  border-radius:var(--r-m);
  background:var(--neg-soft);
  border:var(--bw) solid var(--neg);
  box-shadow:var(--sh-3);
  color:var(--neg);
  font-size:12.5px;line-height:1.5;
  font-family:ui-monospace,Menlo,Consolas,monospace;
  animation:fade-up 240ms var(--ease-out) both;
}
.err-strip::before{
  content:'Ошибка ' attr(data-count);
  position:absolute;top:-11px;left:14px;
  padding:1px 8px;border-radius:99px;
  background:var(--neg);color:#fff;
  font:700 10px/1.6 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;
}
.err-list{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.err-row{word-break:break-word}
.err-close{
  flex:none;width:24px;height:24px;border-radius:var(--r-xs);
  color:var(--neg);font-size:18px;line-height:1;
  background:transparent;border:var(--bw) solid var(--neg-line);
}
.err-close:hover{background:var(--neg);color:#fff}

/* ==================================================================
   ЭКРАН ОШИБКИ ЗАПУСКА
   Появляется, только если игра не смогла стартовать.
   ================================================================== */
.boot-error{
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:var(--sp-6);
}
.be-card{
  max-width:560px;width:100%;
  padding:var(--sp-7);
  border-radius:var(--r-xl);
  background:var(--s-1);
  border:var(--bw) solid var(--neg-line);
  box-shadow:var(--sh-3);
}
.be-kicker{
  font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
